<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Questionnaire Cocktail Kart</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      background-color: #f7f7f7;
    }
    header img {
      max-width: 100%;
      height: auto;
      display: block;
      margin-bottom: 30px;
    }
    .question {
      margin-bottom: 30px;
      padding: 20px;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      display: flex;
      align-items: flex-start;
      gap: 20px;
    }
    .icon {
      width: 50px;
      height: 50px;
    }
    .content {
      flex: 1;
    }
    input {
      padding: 10px;
      margin-right: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    button {
      padding: 10px 15px;
      background-color: #2980b9;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .success {
      margin-top: 10px;
      font-weight: bold;
    }
    .hint {
      margin-top: 50px;
      font-style: italic;
      color: #555;
    }
  </style>
</head>
<body>

  <header>
  <img src="game_images/cocktailkart.png" alt="Questionnaire Cocktail Kart">
  </header>

  <div class="question" id="q1">
    <img class="icon" src="game_images/greenshell.png" alt="Green Shell">
    <div class="content">
      <p>Combien de differences trouvez-vous ?</p>
      <input type="text" id="a1">
      <button onclick="checkAnswer(1, '5', 7)">Entrer</button>
      <div class="success" id="s1"></div>
    </div>
  </div>

  <div class="question" id="q2">
    <img class="icon" src="game_images/redshell.png" alt="Red Shell">
    <div class="content">
      <p>Quel est le mot caché ? </p>
      <input type="text" id="a2">
      <button onclick="checkAnswer(2, 'panoramix', 4)">Entrer</button>
      <div class="success" id="s2"></div>
    </div>
  </div>

  <div class="question" id="q3">
    <img class="icon" src="game_images/mushroom.png" alt="Mushroom">
    <div class="content">
      <p>Quel est le chiffre caché ?</p>
      <input type="text" id="a3">
      <button onclick="checkAnswer(3, '13', 6)">Entrer</button>
      <div class="success" id="s3"></div>
    </div>
  </div>

  <div class="question" id="q4">
    <img class="icon" src="game_images/star.png" alt="Star">
    <div class="content">
      <p>Quel est l'ordre des gagnants ?</p>
      <div>
        <input type="text" id="a4-1">
        <button onclick="checkMultiAnswer(1, 'Daisy')">Entrer</button>
      </div>
      <div>
        <input type="text" id="a4-2">
        <button onclick="checkMultiAnswer(2, 'Bowser')">Entrer</button>
      </div>
      <div>
        <input type="text" id="a4-3">
        <button onclick="checkMultiAnswer(3, 'Waluigi')">Entrer</button>
      </div>
      <div class="success" id="s4"></div>
    </div>
  </div>

  <div class="question" id="q5">
    <img class="icon" src="game_images/giftbox.png" alt="GiftBox">
    <div class="content">
      <p>"L'ordre est indiqué par les réponses du quiz."</p>
    </div>
  </div>

    <!-- Final Code Section -->
  <div class="question" id="final">
    <img class="icon" src="game_images/laitiku.png" alt="Key Icon">
    <div class="content">
      <p>Entrez le code final :</p>
      <input type="text" id="final-code">
      <button onclick="checkFinalCode()">Entrer</button>
      <div class="success" id="final-success"></div>
    </div>
  </div>
  
  <div class="hint">
    Si vous êtes coincées, demandez de l'aide à Maguite !
  </div>


  <script>
    function checkAnswer(num, correctAnswer, revealNumber) {
      const input = document.getElementById('a' + num);
      const success = document.getElementById('s' + num);
      const userAnswer = input.value.trim().toLowerCase();

      if (userAnswer === correctAnswer.toLowerCase()) {
        success.innerHTML = `✔ Bonne réponse ! Le chiffre secret de ce mini-jeu est : <strong>${revealNumber}</strong>`;
        success.style.color = 'green';
        input.style.borderColor = 'green';
        input.disabled = true;
      } else {
        success.innerHTML = "❌ Mauvaise réponse, essayez encore.";
        success.style.color = 'red';
        input.style.borderColor = 'red';
      }
    }

    const q4Answers = {
      1: false,
      2: false,
      3: false
    };

    function checkMultiAnswer(id, correct) {
      const input = document.getElementById(`a4-${id}`);
      const userAnswer = input.value.trim().toLowerCase();
      const result = (userAnswer === correct.toLowerCase());

      q4Answers[id] = result;
      input.style.borderColor = result ? 'green' : 'red';
      input.disabled = result;

      const allCorrect = Object.values(q4Answers).every(v => v === true);
      const success = document.getElementById('s4');

      if (allCorrect) {
        success.innerHTML = `✔ Toutes les bonnes réponses ! Le chiffre secret de ce mini-jeu est : <strong>2</strong>`;
        success.style.color = 'green';
      } else {
        success.innerHTML = '';
      }
    }

    function checkFinalCode() {
      const input = document.getElementById('final-code');
      const success = document.getElementById('final-success');
      const code = input.value.trim();

      if (code === '4627') {
        success.innerHTML = "🔑 La clé est sur l'étagère à côté de la télévision!<br>(Soyez discrets et n'oubliez pas de la remettre)";
        success.style.color = 'green';
        input.style.borderColor = 'green';
        input.disabled = true;
      } else {
        success.innerHTML = "❌ Code incorrect.";
        success.style.color = 'red';
        input.style.borderColor = 'red';
      }
    }
  </script>

</body>
</html>
